services:
  - type: web
    name: careerdna-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m scripts.seed_demo --with-demo
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.0"
